# KuberManager uchun ClusterRole — barcha namespace'larda ishlash uchun
# Namespace-scoped Role'lardan ClusterRole'ga o'tildi:
#   - Namespaces cluster-scoped resurs — Role bilan boshqarib bo'lmaydi
#   - Har bir namespace uchun alohida Role takrorlash keraksiz
#   - KuberManager o'zi AllowedNamespaces policy orqali cheklaydi

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubermanager-cluster-role
  labels:
    app: kubermanager
rules:
  # ── Core API ("") ──────────────────────────────────────────────────────────

  # Pods — list, get, delete, logs, exec
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]

  # Namespaces (cluster-scoped)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PersistentVolumeClaims
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # ServiceAccounts
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # Nodes (cluster-scoped) — get/list/watch + cordon/uncordon (patch)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Events — debug uchun foydali
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # ── Apps API ───────────────────────────────────────────────────────────────

  # Deployments
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # StatefulSets
  - apiGroups: ["apps"]
    resources: ["statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # DaemonSets
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ReplicaSets — deployment rollout status uchun kerak
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

  # ── Batch API ──────────────────────────────────────────────────────────────

  # Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # CronJobs
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Networking API ─────────────────────────────────────────────────────────

  # Ingresses
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # NetworkPolicies
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # ── Autoscaling API ────────────────────────────────────────────────────────

  # HorizontalPodAutoscalers
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── RBAC API ───────────────────────────────────────────────────────────────

  # Roles & RoleBindings (namespace-scoped)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # ClusterRoles & ClusterRoleBindings (cluster-scoped)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "delete"]
