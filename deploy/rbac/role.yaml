apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubermanager-role
  namespace: app-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
# Repeat for other namespaces as needed, e.g. app-stage
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubermanager-role
  namespace: app-stage
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
