apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubermanager
  namespace: platform
  labels:
    app: kubermanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubermanager
  template:
    metadata:
      labels:
        app: kubermanager
    spec:
      serviceAccountName: kubermanager-sa
      containers:
        - name: kubermanager
          image: ghcr.io/kubesec-uz/kubermanager:latest
          ports:
            - containerPort: 5001
              name: grpc
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "5001"
            - name: Kubernetes__UseInClusterConfig
              value: "true"
            - name: Policy__AllowedNamespaces__0
              value: "platform"
            - name: Policy__AllowedNamespaces__1
              value: "app-prod"
            - name: Policy__AllowedNamespaces__2
              value: "app-stage"
            - name: Policy__AllowedNamespaces__3
              value: "default"
            - name: Policy__AllowedNamespaces__4
              value: "kube-system"
            - name: Policy__MaxReplicas
              value: "100"
            - name: ApiKey__Keys__kubesec-auth
              valueFrom:
                secretKeyRef:
                  name: kubermanager-api-keys
                  key: kubesec-auth
          # gRPC health check — k8s 1.24+ uchun grpc probe
          # livenessProbe:
          #   grpc:
          #     port: 5001
          #   initialDelaySeconds: 30
          #   periodSeconds: 30
          #   failureThreshold: 5
          # readinessProbe:
          #   grpc:
          #     port: 5001
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          #   failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            # ASP.NET Core tmp fayllar uchun (readOnlyRootFilesystem=true bilan kerak)
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        fsGroup: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: kubermanager
  namespace: platform
  labels:
    app: kubermanager
spec:
  type: NodePort
  selector:
    app: kubermanager
  ports:
    - name: grpc
      port: 5001
      targetPort: 5001
      nodePort: 30501
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubermanager-netpol
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app: kubermanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api
      ports:
        - protocol: TCP
          port: 5001
