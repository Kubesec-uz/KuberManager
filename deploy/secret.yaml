# API key qiymatini base64 encode qilib to'ldiring:
#   echo -n "your-strong-secret" | base64
#
# Yoki kubectl orqali yarating (tavsiya etiladi):
#   kubectl create secret generic kubermanager-api-keys \
#     --namespace platform \
#     --from-literal=kubesec-auth=your-strong-secret
#
# Bu fayl git'ga commit QILINMASIN — faqat namuna sifatida

apiVersion: v1
kind: Secret
metadata:
  name: kubermanager-api-keys
  namespace: platform
  labels:
    app: kubermanager
type: Opaque
data:
  # echo -n "change-me" | base64
  kubesec-auth: Y2hhbmdlLW1l
