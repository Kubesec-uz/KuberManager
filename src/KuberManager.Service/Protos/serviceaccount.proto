syntax = "proto3";

import "Protos/common.proto";

option csharp_namespace = "KuberManager.Contracts";

package kubermanager;

// ──── ServiceAccount ────────────────────────────────────────────────────────

service ServiceAccountService {
  rpc List (ListServiceAccountsRequest) returns (ServiceAccountListReply);
  rpc Get (ServiceAccountRef) returns (ServiceAccountReply);
  rpc Create (CreateServiceAccountRequest) returns (OperationReply);
  rpc Delete (DeleteServiceAccountRequest) returns (OperationReply);
}

message ServiceAccountRef {
  string cluster = 1;
  string namespace = 2;
  string name = 3;
}

message ListServiceAccountsRequest {
  string cluster = 1;
  string namespace = 2;
}

message ServiceAccountReply {
  string name = 1;
  string namespace = 2;
  repeated string secrets = 3;
  string created_at = 4;
}

message ServiceAccountListReply {
  repeated ServiceAccountReply items = 1;
}

message CreateServiceAccountRequest {
  string cluster = 1;
  string namespace = 2;
  string name = 3;
  map<string, string> annotations = 4;
  string requested_by = 5;
  string reason = 6;
  string correlation_id = 7;
}

message DeleteServiceAccountRequest {
  string cluster = 1;
  string namespace = 2;
  string name = 3;
  string requested_by = 4;
  string reason = 5;
  string correlation_id = 6;
}
