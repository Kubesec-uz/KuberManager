syntax = "proto3";

import "Protos/common.proto";

option csharp_namespace = "KuberManager.Contracts";

package kubermanager;

service PersistentVolumeClaimService {
  rpc List (ListPvcsRequest) returns (PvcListReply);
  rpc Get (PvcRef) returns (PvcReply);
  rpc Create (CreatePvcRequest) returns (OperationReply);
  rpc Delete (DeletePvcRequest) returns (OperationReply);
}

message PvcRef {
  string cluster = 1;
  string namespace = 2;
  string name = 3;
}

message ListPvcsRequest {
  string cluster = 1;
  string namespace = 2;
}

message PvcReply {
  string name = 1;
  string namespace = 2;
  string status = 3;
  string storage_class = 4;
  string capacity = 5;
  string access_modes = 6;
  string volume_name = 7;
  string created_at = 8;
}

message PvcListReply {
  repeated PvcReply items = 1;
}

message CreatePvcRequest {
  string cluster = 1;
  string namespace = 2;
  string name = 3;
  string storage_class = 4;
  string storage = 5;          // e.g. "10Gi"
  repeated string access_modes = 6; // ReadWriteOnce, ReadOnlyMany, ReadWriteMany
  string requested_by = 7;
  string reason = 8;
  string correlation_id = 9;
}

message DeletePvcRequest {
  string cluster = 1;
  string namespace = 2;
  string name = 3;
  string requested_by = 4;
  string reason = 5;
  string correlation_id = 6;
}
