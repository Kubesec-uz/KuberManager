syntax = "proto3";

import "Protos/common.proto";

option csharp_namespace = "KuberManager.Contracts";

package kubermanager;

service PodService {
  rpc List (ListPodsRequest) returns (PodListReply);
  rpc Get (PodRef) returns (PodInfoReply);
  rpc GetLogs (PodLogsRequest) returns (PodLogsReply);
  rpc Delete (DeletePodRequest) returns (OperationReply);
  rpc Exec (ExecRequest) returns (stream ExecReply);
}

message PodRef {
  string cluster = 1;
  string namespace = 2;
  string pod_name = 3;
}

message ListPodsRequest {
  string cluster = 1;
  string namespace = 2;
  string app_label = 3;
}

message PodLogsRequest {
  string cluster = 1;
  string namespace = 2;
  string pod_name = 3;
  string container_name = 4;
  int32 tail_lines = 5;
}

message DeletePodRequest {
  string cluster = 1;
  string namespace = 2;
  string pod_name = 3;
  string requested_by = 4;
  string reason = 5;
  string correlation_id = 6;
}

message ExecRequest {
  string cluster = 1;
  string namespace = 2;
  string pod_name = 3;
  string container_name = 4;
  repeated string command = 5;
  string requested_by = 6;
  string correlation_id = 7;
}

message ExecReply {
  string output = 1;
  bool is_stderr = 2;
  bool is_done = 3;
  int32 exit_code = 4;
}

message PodInfoReply {
  string name = 1;
  string namespace = 2;
  string phase = 3;
  string node_name = 4;
  string pod_ip = 5;
  string start_time = 6;
  repeated ContainerStatusReply containers = 7;
}

message ContainerStatusReply {
  string name = 1;
  bool ready = 2;
  int32 restart_count = 3;
  string state = 4;
}

message PodListReply {
  repeated PodInfoReply pods = 1;
}

message PodLogsReply {
  string pod_name = 1;
  string content = 2;
}
